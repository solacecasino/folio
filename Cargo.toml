[package]
name = "folio"
version = "1.0.0"
edition = "2024"
description = "A document editor that ships bare and is endlessly customizable through themes and adapters."
license = "MIT"
repository = "https://github.com/solacecasino/folio"

[features]
# WebAssembly plugins (Wasmtime). Build without it for folio-lite:
# cargo build --release --no-default-features
default = ["wasi-plugins"]
wasi-plugins = ["dep:folio_plugin"]

[dependencies]
eframe = "0.37.0"
folio_plugin = { path = "crates/folio_plugin", optional = true }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# macOS: the native menu bar and the system spell checker.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSArray"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the system spell checker, local time and process checks.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Windows and Linux: removed adapters go to the system trash.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"

# Linux: Hunspell dictionaries for spell checking.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
spellbook = "0.4.2"

[workspace]
members = ["crates/folio_plugin"]
# Test guests are WebAssembly crates built separately.
exclude = ["crates/folio_plugin/tests/guest"]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
# Keep the shipped app small: whole-program optimization drops code that
# isn't used (a lot, with Wasmtime linked in).
strip = true
lto = true
codegen-units = 1
