[package]
name = "text9000"
version = "3.0.1"
edition = "2024"
description = "A document editor that ships bare and is endlessly customizable through themes and adapters."
license = "MIT"
repository = "https://github.com/solacecasino/text9000"

[features]
# WebAssembly plugins (Wasmtime). Build without it for text9000 Lite:
# cargo build --release --no-default-features
default = ["wasi-plugins"]
wasi-plugins = ["dep:folio_plugin"]

[dependencies]
# The 9000 series' shared core: the window, the family protocol and the
# sisters.
core9000 = { git = "https://github.com/solacecasino/core9000", tag = "v0.1.1" }
memmap2 = "0.9.12"
# init.lua scripting. Lua 5.4 is compiled in, so nothing extra is needed to run text9000.
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
# The interface (egui), the window and input (winit, egui-winit), and the
# pixels: drawn by the CPU (core9000's shell), so no graphics driver is loaded.
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "accesskit", "clipboard", "links", "wayland", "x11",
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
accesskit_winit = "0.34.1"
raw-window-handle = "0.6.2"
png = "0.18.1"
folio_plugin = { path = "crates/folio_plugin", optional = true }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
ttf-parser = "0.25.1"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# macOS: the native menu bar and the system spell checker.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpellChecker", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSArray", "NSDictionary", "NSValue", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the system spell checker, local time and process checks.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# Windows and Linux: removed adapters go to the system trash, and softbuffer
# hands the drawn pixels to the window.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

# Linux: Hunspell dictionaries for spell checking.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
spellbook = "0.4.2"

[workspace]
members = ["crates/folio_plugin"]
# Test guests are WebAssembly crates built separately.
exclude = ["crates/folio_plugin/tests/guest"]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
# Keep the shipped app small: whole-program optimization drops code that
# isn't used (a lot, with Wasmtime linked in).
strip = true
lto = true
codegen-units = 1
