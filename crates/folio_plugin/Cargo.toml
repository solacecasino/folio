[package]
name = "folio_plugin"
version = "0.1.0"
edition = "2024"
description = "Folio's sandboxed WebAssembly plugin runtime (Wasmtime, WASI Preview 2)"
license = "MIT"
repository = "https://github.com/solacecasino/folio"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "net"] }
toml = "0.9"
wasmtime = { version = "50.0.0", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "parallel-compilation", "std"] }
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }
