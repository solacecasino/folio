# Classic double-spaced manuscript format.
name = "Manuscript"

[page]
# Header and footer use the formatting language (docs/customizing.md).
header = "%file% / %page%"

[colors]
background = "#4a4640"
page = "#ffffff"
text = "#000000"
cursor = "#000000"

[fonts.times]
regular = ["Times New Roman.ttf", "times.ttf", "LiberationSerif-Regular.ttf", "DejaVuSerif.ttf"]
bold = ["Times New Roman Bold.ttf", "timesbd.ttf", "LiberationSerif-Bold.ttf", "DejaVuSerif-Bold.ttf"]
italic = ["Times New Roman Italic.ttf", "timesi.ttf", "LiberationSerif-Italic.ttf", "DejaVuSerif-Italic.ttf"]
bold_italic = ["Times New Roman Bold Italic.ttf", "timesbi.ttf", "LiberationSerif-BoldItalic.ttf", "DejaVuSerif-BoldItalic.ttf"]

[styles.body]
font = "times"
size = 12
line_height = 2.0
indent = 0.5
space_after = 0
align = "justify"
key = 0

[styles.title]
font = "times"
size = 12
bold = true
line_height = 2.0
align = "center"
space_after = 0
next = "body"
key = 9

[styles.h1]
font = "times"
size = 12
bold = true
line_height = 2.0
align = "center"
next = "body"
key = 1
