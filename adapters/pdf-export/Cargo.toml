[package]
name = "pdf-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Folio adapter that exports the document as a print-perfect PDF."
publish = false

# Standalone: not part of Folio's workspace, with its own target/.
[workspace]

[[bin]]
name = "pdf-export"
path = "src/main.rs"

[dependencies]
krilla = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
