# Live co-editing over encrypted peer-to-peer links. See docs/folio-link.md.
name = "Folio Link"
version = "0.1.0"
author = "Folio"
license = "MIT"
description = "Edit a document together, live, over an encrypted direct link. No accounts."

# Built by ./build.sh.
run = ["./folio-link"]

permissions = ["document.read", "document.edit", "network"]

# Nothing runs, and nothing goes online, until you choose Share or Join.
start = "command"

events = ["snapshot"]

[[commands]]
id = "share"
label = "Share This Document"

[[commands]]
id = "join"
label = "Join from Clipboard"

[[commands]]
id = "stop"
label = "Stop Sharing"

[[commands]]
id = "copy-invite"
label = "Copy Invite Again"

[[panels]]
id = "people"
title = "People"
