[package]
name = "folio-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Live co-editing for Folio over encrypted peer-to-peer links"
publish = false

# Standalone: building Folio itself never compiles iroh or loro.
[workspace]

[dependencies]
loro = "1.17"
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
data-encoding = "2"
getrandom = "0.3"

[profile.release]
strip = true
