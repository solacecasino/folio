# Lint and test on every push to main and every pull request, on all three
# systems, so problems show up the day they're made instead of on release day.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev hunspell-en-us fonts-dejavu-core

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (Folio Lite)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Test the plugin runtime
        shell: bash
        run: |
          rustup target add wasm32-wasip2
          cargo test -p folio_plugin
