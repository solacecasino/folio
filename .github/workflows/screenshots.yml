# Runs text9000 on Windows and Linux, types a little, and takes screenshots,
# so drawn menus, lists, links, spell check and Tab can be checked by eye
# without those machines. Runs with every release (release.yml), and by
# hand: Actions → Screenshots → Run workflow.
name: Screenshots

on:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev xvfb xdotool imagemagick hunspell-en-us fonts-dejavu-core zenity openbox
      - name: Build
        run: cargo build --no-default-features
      - name: Run and take screenshots
        run: |
          mkdir -p shots cfg
          export FOLIO_CONFIG_DIR=$PWD/cfg DISPLAY=:99
          Xvfb :99 -screen 0 1280x1000x24 &
          sleep 2
          # A window manager, so text9000's window gets keyboard focus.
          openbox &
          sleep 1
          ./target/debug/text9000 --version
          ./target/debug/text9000 examples/welcome.folio &
          sleep 10
          # Fails in a minute, not hours, if the window never appears.
          W=$(timeout 60 xdotool search --sync --class text9000 | head -1)
          [ -n "$W" ] || { echo "text9000 never opened a window"; exit 1; }
          xdotool windowactivate --sync "$W"
          shot() { import -window root "shots/$1.png"; }
          shot 1-start
          # Positions relative to text9000's window: the menus are in its top strip.
          xdotool mousemove --window "$W" 70 14 click 1; sleep 1; shot 2-menu
          xdotool key Escape; sleep 0.5
          xdotool mousemove --window "$W" 500 500 click 1; sleep 0.5
          xdotool key ctrl+End; sleep 0.3
          xdotool key Return
          xdotool type --delay 40 "Typed on Linnux, then a tab:"
          xdotool key Return Tab
          xdotool type --delay 40 "after a tab and spaces"
          sleep 1; shot 3-typing
          xdotool key ctrl+Home; sleep 0.5; shot 4-ctrl-home
          xdotool key ctrl+alt+l; sleep 1; shot 5-log
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: shots/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --no-default-features
      - name: Run and take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots, cfg | Out-Null
          $env:FOLIO_CONFIG_DIR = "$PWD\cfg"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("shots\$name.png")
          }
          $p = Start-Process -FilePath target\debug\text9000.exe -ArgumentList "examples\welcome.folio" -PassThru
          Start-Sleep 12
          Shot "1-start"
          $wshell = New-Object -ComObject wscript.shell
          $null = $wshell.AppActivate($p.Id)
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("^{END}")
          Start-Sleep 1
          Shot "2-ctrl-end"
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}Typed on Windowss, then a tab:{ENTER}{TAB}after a tab and spaces")
          Start-Sleep 1
          Shot "3-typing"
          [System.Windows.Forms.SendKeys]::SendWait("^{HOME}")
          Start-Sleep 1
          Shot "4-ctrl-home"
          [System.Windows.Forms.SendKeys]::SendWait("^%l")
          Start-Sleep 1
          Shot "5-log"
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows
          path: shots/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --no-default-features
      - name: Run and take screenshots
        run: |
          mkdir -p shots cfg
          export FOLIO_CONFIG_DIR=$PWD/cfg
          ./target/debug/text9000 examples/welcome.folio &
          PID=$!
          sleep 10
          shot() { screencapture -x "shots/$1.png"; }
          keys() { osascript -e "tell application \"System Events\" to $1"; }
          keys "set frontmost of (first process whose unix id is $PID) to true"
          sleep 1
          shot 1-start
          keys "key code 125 using command down"; sleep 0.5   # Cmd+Down: end of document
          keys "key code 36"
          keys "keystroke \"Typed on macOOS, then a tab:\""
          keys "key code 36"; keys "key code 48"
          keys "keystroke \"after a tab and spaces\""
          sleep 1; shot 2-typing
          keys "key code 126 using command down"; sleep 0.5; shot 3-top
          keys "keystroke \"l\" using {command down, option down}"; sleep 1; shot 4-log
          kill $PID
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-macos
          path: shots/
