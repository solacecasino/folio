# Builds and tests Folio on macOS, Windows and Linux. Pushing a tag like
# v0.6.0 also publishes a GitHub release with all three downloads, using
# docs/releases/<tag>.md as the notes. Run it by hand (Actions → Release →
# Run workflow) to get the downloads as artifacts without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # one universal app, for Apple Silicon and Intel
          - os: windows-latest
          - os: ubuntu-22.04      # an older glibc, so it runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev hunspell-en-us fonts-dejavu-core

      - name: Test
        run: cargo test

      - name: Test the plugin runtime
        shell: bash
        run: |
          rustup target add wasm32-wasip2
          cargo test -p folio_plugin

      - name: Package
        shell: bash
        env:
          UNIVERSAL: "1"   # only read on macOS
        run: |
          python scripts/package.py
          python scripts/package.py --lite   # folio-lite: no plugin runtime

      - name: Check that the downloads start
        shell: bash
        run: |
          set -e
          cd dist
          for f in *; do
            case "$f" in
              *.tar.gz) tar xzf "$f" ;;
              *.zip) python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('x-' + sys.argv[1])" "$f" ;;
            esac
          done
          for exe in $(find . -path ./x-\*/Folio.app/Contents/MacOS/folio -o -name folio.exe -o -type f -name folio -perm -u+x); do
            chmod +x "$exe" 2>/dev/null || true
            echo "$exe: $("$exe" --version)"
          done
          for app in x-*/Folio.app/Contents/MacOS/folio; do
            [ -e "$app" ] || continue
            archs=$(lipo -archs "$app"); echo "$app: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "not universal"; exit 1 ;; esac
          done
          rm -rf x-* folio-*-linux-x64/ folio-lite-*-linux-x64/

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  # Screenshots of the release on each platform, to look over by eye.
  # They don't hold up the release.
  screenshots:
    uses: ./.github/workflows/screenshots.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" dist/* --title "Folio ${tag#v}" "$@"
